name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite stubs `gh`, so no network or credentials are needed. It uses
      # jq, which is preinstalled on the runner but installed here for
      # portability. `inotify-tools` is no longer needed: v2 has no watcher.
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      # Tests that create throwaway git repos + commit need an identity; runners
      # have none by default. Individual tests set a per-repo identity, but a
      # global fallback keeps any that don't from failing.
      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      - name: Run test suite
        working-directory: skills/watch-prs/scripts
        run: |
          set -uo pipefail
          fail=0 total=0
          for t in test-*.sh; do
            total=$((total + 1))
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS $t"
            else
              echo "::error file=skills/watch-prs/scripts/$t::$t failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          echo "----"
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more of $total test files failed"
            exit 1
          fi
          echo "all $total test files passed"

  # The same suite, with the GNU-only tools GONE. `test-portability.sh` scans the
  # text for constructs BSD rejects, and text cannot see a command name built at
  # runtime — `_a=sha1; _b=sum; "$_a$_b"` is invisible to any scan and dies here at
  # once. So this job removes them from `PATH` and runs everything.
  #
  # It catches a use whose failure PROPAGATES, which is not every use: `for i in
  # $(seq 1 5)` with `seq` gone yields an empty list and the loop just does not
  # run. Measured, not assumed. So this job and that scan are not supersets of one
  # another in either direction, and both are kept.
  #
  # A separate JOB rather than a second step, so it runs in parallel: the cost is
  # the DIFFERENCE, not the sum. Measured, 9m15s here against 6m35s for the normal
  # job — and this one is the slower of the two precisely because `run_limited`
  # falls back to polling with `sleep` once `timeout` is gone, which is the code
  # path being exercised. In series it would be sixteen minutes, which is a gate
  # people skip.
  #
  # This is also the only place `run_limited`'s fallback arm is exercised across
  # the whole suite: the normal job has GNU `timeout` and takes the other one.
  # Stock macOS has neither this job's shims nor `timeout`, which is the
  # configuration being stood in for.
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      # Shims that FAIL LOUDLY rather than being absent. A missing command gives
      # `command not found` on stderr and a 127 that a `|| true` somewhere might
      # swallow; a shim that names itself puts the reason in the log next to the
      # test that tripped it. `command -v` still finds them, so a correctly
      # GUARDED use — `command -v timeout && timeout 5 …` — takes the shim and
      # fails, which is wrong: the guard's whole point is that the fallback runs.
      # So the shims are NOT on PATH for `command -v` to find. They are absent,
      # and the loud part is the summary this step prints if the suite fails.
      - name: Remove the GNU-only tools
        run: |
          set -euo pipefail
          # KEPT IN STEP with `GNU_ONLY_NAMES` in test-portability.sh, plus the
          # English-colliding names that only this job can cover — `timeout`,
          # `seq`, `truncate`. A tool in neither list is covered by nothing, and
          # `test-portability.sh` now CHECKS this containment rather than trusting
          # this comment: every scanned name must appear here.
          #
          # THE `g`-PREFIXED SPELLINGS ARE NOT HERE, and the reason was measured
          # rather than assumed. They were added on the theory that hiding a tool
          # the runner does not have is a harmless no-op; Ubuntu's `awk` is a
          # symlink chain ending at `/usr/bin/gawk`, so hiding `gawk` removed `awk`
          # itself and every scan in the suite died with `command not found`.
          # They are the Homebrew names a macOS contributor may reach for, and the
          # text scan is what covers them.
          tools="timeout sha1sum sha256sum md5sum seq realpath tac shuf nproc
                 stdbuf truncate dircolors numfmt shred"
          # UNTIL NONE RESOLVES, not once. A runner can carry a second copy later
          # in PATH — /usr/bin and /usr/local/bin both having `realpath` is
          # ordinary — and moving only the first resolution leaves the tool
          # available while the log says it was hidden.
          for c in $tools; do
            while p="$(command -v "$c" 2>/dev/null)"; do
              sudo mv "$p" "$p.hidden-for-portability-job"
              echo "hidden: $p"
              hash -r 2>/dev/null || true
            done
          done
          # Proven gone, not assumed gone, and for EVERY name. Checking three of
          # twelve let a partial removal look like a clean portability run — this
          # job would then be a second, slower copy of the normal one, passing for
          # the reason it exists to rule out.
          still=""
          for c in $tools; do
            command -v "$c" >/dev/null 2>&1 && still="$still $c"
          done
          if [ -n "$still" ]; then
            echo "::error::still on PATH:$still — this job would prove nothing"
            exit 1
          fi
          echo "all hidden, none resolves"

      # …and the removal is proven to BITE, not merely to have happened. A step
      # that hid nothing and a step that hid everything both leave the suite
      # green; what distinguishes them is that a use of one of these now fails.
      - name: Prove the removal is effective
        run: |
          set -uo pipefail
          if seq 1 3 >/dev/null 2>&1; then
            echo "::error::seq still runs; the removal did not take effect"
            exit 1
          fi
          echo "confirmed: seq no longer runs"

      - name: Run test suite without the GNU-only tools
        working-directory: skills/watch-prs/scripts
        run: |
          set -uo pipefail
          fail=0 total=0
          for t in test-*.sh; do
            total=$((total + 1))
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS $t"
            else
              echo "::error file=skills/watch-prs/scripts/$t::$t failed without the GNU-only tools"
              fail=1
            fi
            echo "::endgroup::"
          done
          echo "----"
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more of $total test files needs a GNU-only tool"
            exit 1
          fi
          echo "all $total test files passed without the GNU-only tools"
