name: tests

# ONE RUN PER PUSH. `push` on every branch plus `pull_request` fired BOTH for every
# push to a PR branch — the whole workflow twice, for the same commit, telling us the
# same thing. Pushes to the default branch are covered directly; everything else is
# covered as a pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite stubs `gh`, so no network or credentials are needed. It uses
      # jq, which is preinstalled on the runner but installed here for
      # portability. `inotify-tools` is no longer needed: v2 has no watcher.
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      # Tests that create throwaway git repos + commit need an identity; runners
      # have none by default. Individual tests set a per-repo identity, but a
      # global fallback keeps any that don't from failing.
      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      - name: Run test suite
        working-directory: skills/watch-prs/scripts
        run: |
          set -uo pipefail
          fail=0 total=0
          for t in test-*.sh; do
            total=$((total + 1))
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS $t"
            else
              echo "::error file=skills/watch-prs/scripts/$t::$t failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          echo "----"
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more of $total test files failed"
            exit 1
          fi
          echo "all $total test files passed"

  # The same suite, with the GNU-only tools GONE. `test-portability.sh` scans the
  # text for constructs BSD rejects, and text cannot see a command name built at
  # runtime — `_a=sha1; _b=sum; "$_a$_b"` is invisible to any scan and dies here at
  # once. So this job removes them from `PATH` and runs everything.
  #
  # It catches a use whose failure PROPAGATES, which is not every use: `for i in
  # $(seq 1 5)` with `seq` gone yields an empty list and the loop just does not
  # run. Measured, not assumed. So this job and that scan are not supersets of one
  # another in either direction, and both are kept.
  #
  # A separate JOB rather than a second step, so it runs in parallel: the cost is
  # the DIFFERENCE, not the sum. Measured, 9m15s here against 6m35s for the normal
  # job — and this one is the slower of the two precisely because `run_limited`
  # falls back to polling with `sleep` once `timeout` is gone, which is the code
  # path being exercised. In series it would be sixteen minutes, which is a gate
  # people skip.
  #
  # This is also the only place `run_limited`'s fallback arm is exercised across
  # the whole suite: the normal job has GNU `timeout` and takes the other one.
  # Stock macOS has neither this job's shims nor `timeout`, which is the
  # configuration being stood in for.
  # ── THE CONSTRUCTS, BEHAVIOURALLY ──────────────────────────────────────────
  #
  # A text scan can only ever ask whether a construct LOOKS present. Running the
  # suite under the bash macOS actually ships answers whether it IS: `mapfile`,
  # `declare -A`, `${x^^}`, `coproc`, `wait -n`, `shopt -s lastpipe` and every other
  # post-3.2 spelling simply fail there. No grammar, no parser, no list to keep one
  # entry behind.
  #
  # WHAT IT DOES NOT COVER, stated rather than assumed: a construct on a branch the
  # suite never takes. Coverage here is high — the suite is the pre-push gate and
  # every helper has one — but it is not total, which is why the text scan keeps the
  # rules whose surfaces are small enough to be worth it.
  #
  # BUILT FROM SOURCE, because no runner image ships a 3.2 and a container would pin
  # us to someone else's libc. It is 3.2.57, the version macOS ships, and the build
  # is cached on the tarball hash.
  bash32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      - name: Cache bash 3.2
        id: cache-bash32
        uses: actions/cache@v4
        with:
          path: ~/bash32
          key: bash-3.2.57-${{ runner.os }}

      - name: Build bash 3.2
        if: steps.cache-bash32.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/bash32src && cd /tmp/bash32src
          curl -fsSLO https://ftp.gnu.org/gnu/bash/bash-3.2.tar.gz
          tar xzf bash-3.2.tar.gz && cd bash-3.2
          # 3.2 predates the compilers on this runner; these two keep it building
          # without changing what the shell accepts.
          ./configure --prefix="$HOME/bash32" --without-bash-malloc \
            CFLAGS="-O2 -std=gnu89 -Wno-implicit-function-declaration"
          make -j"$(nproc)" && make install

      - name: Prove it is 3.2
        run: |
          set -euo pipefail
          "$HOME/bash32/bin/bash" --version | head -1
          case "$("$HOME/bash32/bin/bash" -c 'echo "$BASH_VERSION"')" in
            3.2*) echo "confirmed 3.2" ;;
            *) echo "::error::not bash 3.2"; exit 1 ;;
          esac
          # …and that it REJECTS what it should, so a build that quietly produced a
          # newer bash cannot pass this job silently.
          if "$HOME/bash32/bin/bash" -c 'declare -A m' 2>/dev/null; then
            echo "::error::this bash accepts declare -A; it is not 3.2"
            exit 1
          fi
          echo "confirmed: declare -A is rejected"

      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      - name: Run test suite under bash 3.2
        working-directory: skills/watch-prs/scripts
        run: |
          set -uo pipefail
          fail=0 total=0
          for t in test-*.sh; do
            total=$((total + 1))
            echo "::group::$t"
            if "$HOME/bash32/bin/bash" "$t"; then
              echo "PASS $t"
            else
              echo "::error file=skills/watch-prs/scripts/$t::$t failed under bash 3.2"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more of $total test files needs a bash newer than 3.2"
            exit 1
          fi
          echo "all $total test files pass under bash 3.2"

  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      # Shims that FAIL LOUDLY rather than being absent. A missing command gives
      # `command not found` on stderr and a 127 that a `|| true` somewhere might
      # swallow; a shim that names itself puts the reason in the log next to the
      # test that tripped it. `command -v` still finds them, so a correctly
      # GUARDED use — `command -v timeout && timeout 5 …` — takes the shim and
      # fails, which is wrong: the guard's whole point is that the fallback runs.
      # So the shims are NOT on PATH for `command -v` to find. They are absent,
      # and the loud part is the summary this step prints if the suite fails.
      # `awk` IS NOT `gawk`, AND THE JOB HAS TO KEEP THAT DISTINCTION. POSIX
      # specifies `awk` and macOS ships one; `gawk` is the GNU name and is what a
      # portable script must not call. On Ubuntu they are the same file — `awk` is
      # a symlink chain ending at `/usr/bin/gawk` — so hiding the GNU name removed
      # the POSIX one with it and every scan in the suite, all of which are written
      # in awk, died with `command not found`.
      #
      # A REAL COPY UNDER THE POSIX NAME breaks that chain: `/usr/local/bin/awk` is
      # a file rather than a link, it precedes `/usr/bin` on PATH, and it survives
      # `/usr/bin/gawk` being moved away. The job then covers what it is for — a
      # `gawk` assembled at runtime, which no text scan can see — while the suite
      # still runs.
      - name: Preserve a POSIX awk before the GNU name goes
        run: |
          set -euo pipefail
          real_awk="$(readlink -f "$(command -v awk)")"
          sudo cp "$real_awk" /usr/local/bin/awk
          hash -r 2>/dev/null || true
          [ "$(command -v awk)" = /usr/local/bin/awk ] || {
            echo "::error::/usr/local/bin/awk does not win on PATH: $(command -v awk)"
            exit 1
          }
          awk 'BEGIN { exit 0 }' || { echo "::error::the preserved awk does not run"; exit 1; }
          echo "preserved: $real_awk -> /usr/local/bin/awk"

      - name: Remove the GNU-only tools
        run: |
          set -euo pipefail
          # KEPT IN STEP with `GNU_ONLY_NAMES` in test-portability.sh, plus the
          # English-colliding names that only this job can cover — `timeout`,
          # `seq`, `truncate`. A tool in neither list is covered by nothing, and
          # `test-portability.sh` now CHECKS this containment rather than trusting
          # this comment: every scanned name must appear here.
          #
          # The `g`-prefixed spellings are the Homebrew names a macOS contributor
          # may reach for. Hiding them is what the step above preserves `awk` for.
          tools="timeout sha1sum sha256sum md5sum seq realpath tac shuf nproc
                 stdbuf truncate dircolors numfmt shred
                 gsed gawk gdate gcp gln gsort gtimeout gnproc"
          # UNTIL NONE RESOLVES, not once. A runner can carry a second copy later
          # in PATH — /usr/bin and /usr/local/bin both having `realpath` is
          # ordinary — and moving only the first resolution leaves the tool
          # available while the log says it was hidden.
          for c in $tools; do
            while p="$(command -v "$c" 2>/dev/null)"; do
              sudo mv "$p" "$p.hidden-for-portability-job"
              echo "hidden: $p"
              hash -r 2>/dev/null || true
            done
          done
          # Proven gone, not assumed gone, and for EVERY name. Checking three of
          # twelve let a partial removal look like a clean portability run — this
          # job would then be a second, slower copy of the normal one, passing for
          # the reason it exists to rule out.
          still=""
          for c in $tools; do
            command -v "$c" >/dev/null 2>&1 && still="$still $c"
          done
          if [ -n "$still" ]; then
            echo "::error::still on PATH:$still — this job would prove nothing"
            exit 1
          fi
          # …and the POSIX name still works, which is the whole point of the copy.
          awk 'BEGIN { exit 0 }' || {
            echo "::error::awk stopped working when the GNU names were hidden"
            exit 1
          }
          echo "all hidden, none resolves; awk still runs"

      # …and the removal is proven to BITE, not merely to have happened. A step
      # that hid nothing and a step that hid everything both leave the suite
      # green; what distinguishes them is that a use of one of these now fails.
      - name: Prove the removal is effective
        run: |
          set -uo pipefail
          if seq 1 3 >/dev/null 2>&1; then
            echo "::error::seq still runs; the removal did not take effect"
            exit 1
          fi
          echo "confirmed: seq no longer runs"
          # AND AN ASSEMBLED NAME, which is the case only this job can reach: a
          # target spelling `_a=g; _b=awk; "$_a$_b" …` has no literal `gawk` for any
          # text scan to find, so absence is the only thing that catches it.
          _a=g; _b=awk
          if "$_a$_b" 'BEGIN { exit 0 }' >/dev/null 2>&1; then
            echo "::error::a gawk assembled at runtime still resolves"
            exit 1
          fi
          echo "confirmed: an assembled gawk no longer runs"

      - name: Run test suite without the GNU-only tools
        working-directory: skills/watch-prs/scripts
        run: |
          set -uo pipefail
          fail=0 total=0
          for t in test-*.sh; do
            total=$((total + 1))
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS $t"
            else
              echo "::error file=skills/watch-prs/scripts/$t::$t failed without the GNU-only tools"
              fail=1
            fi
            echo "::endgroup::"
          done
          echo "----"
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more of $total test files needs a GNU-only tool"
            exit 1
          fi
          echo "all $total test files passed without the GNU-only tools"
