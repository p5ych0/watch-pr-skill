name: tests

# ONE RUN PER PUSH. `push` on every branch plus `pull_request` fired BOTH for every
# push to a PR branch — the whole workflow twice, for the same commit, telling us
# the same thing. Pushes to the default branch are covered directly; everything
# else is covered as a pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite stubs `gh`, so no network or credentials are needed. It uses
      # jq, which is preinstalled on the runner but installed here for
      # portability. `inotify-tools` is no longer needed: v2 has no watcher.
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      # Tests that create throwaway git repos + commit need an identity; runners
      # have none by default. Individual tests set a per-repo identity, but a
      # global fallback keeps any that don't from failing.
      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      - name: Run test suite
        working-directory: skills/watch-prs/scripts
        run: |
          set -uo pipefail
          fail=0 total=0
          for t in test-*.sh; do
            total=$((total + 1))
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS $t"
            else
              echo "::error file=skills/watch-prs/scripts/$t::$t failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          echo "----"
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more of $total test files failed"
            exit 1
          fi
          echo "all $total test files passed"

  # ── THE SUITE, ON A MACHINE SHAPED LIKE A MAC ──────────────────────────────
  #
  # The suite is a mandatory pre-push gate, so a GNU-only construct in it stops a
  # macOS contributor from closing a review round while Ubuntu CI stays green: the
  # failure is invisible on the machine that introduces it, which is why review
  # kept being the thing that caught it. Four had already reached the tree —
  # `timeout`, `sha1sum`, `seq`, and `\s` in a `grep` pattern.
  #
  # THIS JOB RUNS THE SUITE RATHER THAN READING IT. Both halves of the difference
  # are set up and the existing tests are the check:
  #
  #   - Bash is 3.2.57, the patch level macOS ships — the base tarball with the
  #     official patch series 001 through 057 applied, and the built shell is made
  #     to say `3.2.57` before anything runs.
  #
  #     THE PATCHES ARE NOT OPTIONAL, and the argument for skipping them was
  #     backwards. "Later patches are bug fixes, so the base parser can only be
  #     stricter" is false in the direction that matters: the environment-function
  #     hardening in the 052+ range REJECTS input 3.2.0 accepts, and this suite
  #     exports functions. A 3.2.0 job would have gone green for behaviour stock
  #     macOS refuses, which is the failure this whole job exists to prevent.
  #
  #     `mapfile`, `declare -A`, `${x^^}`, `coproc`, `wait -n`,
  #     `shopt -s lastpipe` and every other post-3.2 spelling
  #     simply fail. So do the PARSING differences, which no list of features would
  #     ever have contained: an inline `[[ … =~ … ]]` pattern with a parenthesis is
  #     a syntax error there, and `pr-watch.sh` carried one from the day it was
  #     written.
  #   - The GNU-only tools are gone from `PATH`, which is the only thing that sees
  #     a command name assembled at runtime: `_a=sha1; _b=sum; "$_a$_b"` is
  #     invisible to any text scan and dies here at once.
  #
  # A TEXT SCANNER WAS BUILT FOR THIS AND DELETED. It reached 2,200 lines and
  # fifty-two review rounds; every round it answered one finding and produced the
  # next, and several of its own defects rejected portable code. `CLAUDE.md` records
  # the same shape twice more: six successive versions of a structural check on
  # `return`, each defeated by legal Bash, and each reporting PASS while its stated
  # invariant was false. Running the thing needs no grammar and cannot be one entry
  # behind.
  #
  # WHAT IT DOES NOT COVER, stated rather than assumed:
  #
  #   - A construct on a branch the suite never takes. Coverage is high — this IS
  #     the pre-push gate and every helper has a test — but it is not total.
  #   - A GNU-only FLAG on a portable command: `sed -i`, `readlink -f`, `grep -P`,
  #     `date -d`. The command exists here, so absence cannot see it.
  #   - `\s` in a `grep` pattern. BSD `grep` does not FAIL on it; it matches a
  #     literal `s`, so the suite passes and the behaviour is silently wrong. This
  #     runner has GNU grep. It is the one item from the original issue that
  #     nothing here catches, and it is review's job.
  #   - A use whose failure does not propagate. `for i in $(seq 1 5)` with `seq`
  #     gone yields an empty list and the loop simply does not run.
  #
  # ONE JOB RATHER THAN TWO. Splitting the shell and the tools apart named the
  # cause more precisely and cost a third more runner minutes for it; the failing
  # test and its error are in the log either way.
  macos-shell:
    runs-on: ubuntu-latest
    # ONE DEFINITION OF THE DIGEST, used by the verification AND by the cache key.
    # It has to key the cache: the first version of this pin left the key at
    # `bash-3.2-<os>`, which an earlier UNVERIFIED build had already populated, so
    # the cache hit skipped the very step that does the checking and the unverified
    # binary went on `PATH` and ran anyway. A check a stale cache can skip is not a
    # check. Changing the pin now misses the cache by construction and rebuilds.
    env:
      BASH32_SHA256: 26c99025b59e30779300b68adb764f824974d267a4d7cc1b347d14a2393f9fb4
      # ONE DIGEST OVER THE WHOLE SERIES, taken across `bash32-001` … `bash32-057`
      # concatenated in order. Fifty-seven pinned values would be fifty-seven
      # chances to mistype one; this fails closed on any of them changing, and was
      # computed from a set whose every detached signature verifies against the
      # same key as the tarball.
      BASH32_PATCHES_SHA256: 6839d51fdeff01dcbe5e52c4cc7174cb655d44a110535efe2357c4645aa22230
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      # BUILT FROM SOURCE, because no runner image ships a 3.2 and a container
      # would pin us to someone else's libc. Cached on the version, so the build
      # runs once.
      - name: Cache bash 3.2
        id: cache-bash32
        uses: actions/cache@v4
        with:
          path: ~/bash32
          key: bash-3.2.57-${{ runner.os }}-${{ env.BASH32_SHA256 }}-${{ env.BASH32_PATCHES_SHA256 }}

      # THE DIGEST IS PINNED, and the build stops if it does not match. This step
      # downloads a tarball and runs `configure` and `make` from it, so whatever
      # arrives executes in CI with the job's permissions; a bare `curl | build`
      # trusts the network and the mirror to be honest on every run, forever.
      # `BASH32_SHA256` is the digest of the tarball whose detached GNU signature
      # verifies against Chet Ramey's key, 7C0135FB088AAF6C66C650B9BB5869F064EA74AB.
      #
      # `sha256sum` IS AVAILABLE HERE and only here: the step that removes the
      # GNU-only tools runs after this one. That ordering is load-bearing.
      - name: Build bash 3.2
        if: steps.cache-bash32.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/bash32src && cd /tmp/bash32src
          curl -fsSLO https://ftp.gnu.org/gnu/bash/bash-3.2.tar.gz
          echo "$BASH32_SHA256  bash-3.2.tar.gz" > bash-3.2.tar.gz.sha256
          sha256sum -c bash-3.2.tar.gz.sha256 || {
            echo "::error::bash-3.2.tar.gz does not match its pinned digest; refusing to build it"
            exit 1
          }
          # THE PATCH SERIES, verified as one stream before any of it is applied.
          mkdir -p patches
          i=1
          while [ "$i" -le 57 ]; do
            n="$(printf '%03d' "$i")"
            curl -fsS -o "patches/bash32-$n" \
              "https://ftp.gnu.org/gnu/bash/bash-3.2-patches/bash32-$n" || {
                echo "::error::patch bash32-$n could not be fetched"; exit 1; }
            i=$((i + 1))
          done
          cat patches/bash32-0* > patches.concat
          echo "$BASH32_PATCHES_SHA256  patches.concat" > patches.sha256
          sha256sum -c patches.sha256 || {
            echo "::error::the bash 3.2 patch series does not match its pinned digest; refusing to build it"
            exit 1
          }
          tar xzf bash-3.2.tar.gz && cd bash-3.2
          for p in ../patches/bash32-0*; do
            patch -p0 -s -i "$p" || { echo "::error::$p did not apply"; exit 1; }
          done
          # THE BUILT SHELL MUST SAY 57. `patchlevel.h` is what the version string
          # is made from, so a series that fetched but half-applied would otherwise
          # produce a 3.2.x that this job accepts as "3.2".
          grep -q '^#define PATCHLEVEL 57$' patchlevel.h || {
            echo "::error::patchlevel.h is not at 57 after applying the series"; exit 1; }
          # 3.2 predates the compilers on this runner; these two keep it building
          # without changing what the shell accepts.
          ./configure --prefix="$HOME/bash32" --without-bash-malloc \
            CFLAGS="-O2 -std=gnu89 -Wno-implicit-function-declaration"
          make -j"$(nproc)" && make install

      # ON PATH, NOT JUST AS THE OUTER INTERPRETER. The suite runs helpers with
      # `#!/usr/bin/env bash` and calls `bash -c` from inside tests; both resolve
      # through PATH, so invoking the 3.2 binary directly pinned only the shell
      # that reads the test FILE and left every nested shell as the runner's bash
      # 5. A job that proved that much would claim far more than it checked.
      - name: Put bash 3.2 first on PATH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bash32/shim"
          ln -sf "$HOME/bash32/bin/bash" "$HOME/bash32/shim/bash"
          echo "$HOME/bash32/shim" >> "$GITHUB_PATH"

      - name: Prove it is 3.2, everywhere it will be used
        run: |
          set -euo pipefail
          bash --version | head -1
          # The three ways the suite reaches a shell: the command name, a nested
          # `bash -c`, and a `#!/usr/bin/env bash` script.
          for probe in 'bash -c' 'nested' 'shebang'; do
            case "$probe" in
              'bash -c') got="$(bash -c 'echo "$BASH_VERSION"')" ;;
              nested)    got="$(bash -c 'bash -c "echo \$BASH_VERSION"')" ;;
              shebang)   printf '#!/usr/bin/env bash\necho "$BASH_VERSION"\n' > /tmp/probe.sh
                         chmod +x /tmp/probe.sh; got="$(/tmp/probe.sh)" ;;
            esac
            # THE EXACT PATCH LEVEL, not `3.2*`. A cached or half-applied build
            # producing 3.2.0 would satisfy a prefix match and quietly test a
            # parser more permissive than the one macOS runs.
            case "$got" in
              3.2.57*) echo "confirmed 3.2.57 via $probe" ;;
              *) echo "::error::$probe reached bash $got, not 3.2.57"; exit 1 ;;
            esac
          done
          # …and that it REJECTS what it should, so a build that quietly produced a
          # newer bash cannot pass this job silently.
          if bash -c 'declare -A m' 2>/dev/null; then
            echo "::error::this bash accepts declare -A; it is not 3.2"
            exit 1
          fi
          echo "confirmed: declare -A is rejected"
      # ── A PATH WITH ONLY WHAT A MAC HAS ───────────────────────────────────
      #
      # This step used to HIDE a list of Linux-only names, and that list was wrong
      # in the way every denylist is wrong: `flock`, `setsid` and `taskset` were
      # missing from it, then `getent`, `ip`, `ss`, `lsns`, `findmnt` and
      # `mountpoint` were missing from the version that added those. Each round
      # answered one finding and produced the next — the exact shape that got a
      # 2,200-line text scanner deleted from this repository, reappearing in a
      # different file.
      #
      # SO THE DEFAULT IS ABSENCE. `PATH` is REPLACED with a directory holding
      # links to an explicit list of commands stock macOS has, plus the three a
      # macOS contributor installs to work here at all (`git`, `gh`, `jq`). A
      # command outside that list does not resolve, whether or not anyone thought
      # of it — so the surface is closed rather than one name behind.
      #
      # The earlier objection to this — "the complement cannot be hidden, the suite
      # needs coreutils" — was answering the wrong question. Nothing is hidden:
      # `PATH` is rebuilt, and the tools the suite legitimately needs are on the
      # list because macOS has them too.
      #
      # WHEN THIS JOB FAILS WITH `command not found` FOR SOMETHING PORTABLE, the
      # list is short by a name: add it, with the check below that it exists on
      # macOS. That failure is a false alarm — loud, safe, and converging — where
      # the denylist's failure was a false green.
      - name: Replace PATH with the commands stock macOS has
        run: |
          set -euo pipefail
          ALLOW="$HOME/macos-path"; mkdir -p "$ALLOW"
          # Stock macOS ships every one of these. `git`, `gh` and `jq` are the
          # three a contributor installs; the suite cannot run without them and
          # neither can a Mac checkout of this repository.
          # `awk` is the POSIX name and is what a portable script calls. On this
          # runner it resolves to gawk, which is why GAWK-ONLY REGEX OPERATORS are
          # in the reviewers' table rather than here: the name is portable and the
          # dialect is not, and no PATH can tell those apart.
          # `base64` and `comm` are here because the first version of this list
          # left them out and the job said so: `base64: command not found`,
          # `comm: command not found`. Stock macOS has both. That is this list
          # working as intended — a name nobody thought of fails LOUDLY rather
          # than passing quietly, which is the whole reason the denylist was
          # replaced.
          cmds="bash sh env git gh jq awk sed grep
                cat cut head tail sort uniq comm wc tr od tee base64
                ls mkdir rmdir rm cp mv ln find xargs chmod touch
                mktemp dirname basename readlink stat
                date sleep ps kill id whoami uname hostname
                diff patch tar gzip gunzip curl openssl shasum
                expr sudo perl"
          # `make`, `cc` and `python3` are NOT here, and their absence is asserted
          # below. macOS ships none of them until the Xcode Command Line Tools are
          # installed, and `README.md` asks a contributor for `git`, `gh` and `jq`
          # only — so allowing the runner's copies would let an unguarded use stay
          # green here and fail for a contributor who did exactly what the README
          # said. `perl` stays: macOS ships it, and `shasum` is written in it.
          # `type -P` RATHER THAN `command -v`, and every name must resolve to a
          # FILE. `command -v` answers with a bare word for a builtin, a function
          # or an alias, and the first version of this treated any such answer as
          # "a builtin needs no link" — so a name that failed to resolve for any
          # other reason was silently skipped and simply missing from the rebuilt
          # PATH. `type -P` searches the filesystem only, which makes "no path"
          # unambiguous. Builtins are not on the list at all: `printf`, `echo` and
          # `test` come with the shell.
          missing=""
          for c in $cmds; do
            cp_="$(type -P "$c" 2>/dev/null)" && [ -n "$cp_" ] \
              || { missing="$missing $c"; continue; }
            ln -sf "$cp_" "$ALLOW/$c"
          done
          [ -z "$missing" ] || { echo "::error::not on this runner:$missing"; exit 1; }
          # …and the link count matches the list, so a silent skip cannot pass.
          want="$(printf '%s\n' $cmds | wc -l)"
          got="$(ls -1 "$ALLOW" | wc -l)"
          [ "$want" -eq "$got" ] \
            || { echo "::error::$want commands listed, $got linked"; exit 1; }
          # REPLACED, not prepended. `GITHUB_PATH` only prepends, which would leave
          # every Linux-only name still reachable further along and make this step
          # decorative.
          echo "PATH=$HOME/bash32/shim:$ALLOW" >> "$GITHUB_ENV"
          echo "PATH is now $HOME/bash32/shim:$ALLOW"

      - name: Prove the PATH is the one that was built
        run: |
          set -euo pipefail
          # PROVEN BOTH WAYS. That the allowed commands resolve, so a green run
          # means the suite ran rather than that everything vanished; and that
          # names macOS lacks do NOT, so this job is not a second copy of the
          # normal one. `flock` is the name that was missing from the denylist for
          # two rounds, and `getent` from the round after.
          for c in bash git gh jq awk sed grep; do
            command -v "$c" >/dev/null 2>&1 \
              || { echo "::error::$c is not reachable; the suite cannot run"; exit 1; }
          done
          absent=""
          # …including the three that are absent on a MAC rather than GNU-only.
          # `make`, `cc` and `python3` arrive with the Xcode Command Line Tools,
          # which `README.md` does not ask for.
          for c in flock setsid taskset ionice unshare nsenter getent ip ss \
                   lsns findmnt mountpoint sha1sum sha256sum md5sum seq realpath \
                   tac shuf nproc stdbuf truncate gawk gsed gdate gtimeout timeout \
                   make cc python3; do
            ! command -v "$c" >/dev/null 2>&1 || absent="$absent $c"
          done
          [ -z "$absent" ] || { echo "::error::still reachable:$absent"; exit 1; }
          echo "confirmed: the allowed commands resolve and the Linux-only ones do not"


      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      - name: Run test suite on bash 3.2.57, on a mac-shaped PATH
        working-directory: skills/watch-prs/scripts
        run: |
          set -uo pipefail
          fail=0 total=0
          for t in test-*.sh; do
            total=$((total + 1))
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS $t"
            else
              echo "::error file=skills/watch-prs/scripts/$t::$t failed on bash 3.2.57 with a mac-shaped PATH"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more of $total test files needs a command macOS lacks, or a bash newer than 3.2"
            exit 1
          fi
          echo "all $total test files pass on bash 3.2.57 with a mac-shaped PATH"
